services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "false"
      AEGIS_DATA_DIR: /app/data
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:?请在环境中设置POSTGRES_PASSWORD}@postgres:5432/aegis
    volumes: ["aegis_data:/app/data"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置POSTGRES_PASSWORD}
      POSTGRES_DB: aegis
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  aegis_data:
  postgres_data:
