[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiscode"
version = "0.2.2"
description = "AegisCode 持久化任务工作台与受控自进化 Agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Your Team" }]
keywords = ["ai", "agent", "rag", "fastapi"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.21.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "tiktoken>=0.8,<1",
    "openai>=2,<4",
    "mcp>=2.2,<3",
    "httpx2>=2.13,<3",
    "jsonschema>=4.23,<5",
    "docker>=7,<8",
    "PyYAML>=6,<7",
]

[project.scripts]
aegiscode = "app.launcher:main"

[project.optional-dependencies]
rag = ["pymilvus>=2.5,<3", "sentence-transformers>=3.3,<6", "numpy>=2,<3"]
legacy = ["gradio>=4"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "playwright>=1.50",
    "pyinstaller>=6",
    "build>=1",
]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
