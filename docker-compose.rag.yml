# 可选混合检索基础设施，与企业/个人 Compose 合并。
services:
  app:
    build:
      context: .
      args:
        INSTALL_RAG: "1"
    environment:
      AEGIS_KNOWLEDGE_BACKEND: hybrid
      AEGIS_KNOWLEDGE_MILVUS_HOST: milvus
    depends_on:
      milvus:
        condition: service_started
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: [etcd, --advertise-client-urls=http://127.0.0.1:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    volumes: ["etcd_data:/etcd"]
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置MinIO账号}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置MinIO密码}
    command: [minio, server, /data]
    volumes: ["minio_data:/data"]
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.4.15
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?请设置MinIO账号}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?请设置MinIO密码}
    depends_on: [etcd, minio]
    volumes: ["milvus_data:/var/lib/milvus"]
    restart: unless-stopped
volumes:
  etcd_data:
  minio_data:
  milvus_data:
